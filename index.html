<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Application Tracker</title>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--panel2:#f0f2f8;--text:#1b1f2e;--muted:#6b7288;--line:#e3e6ef;--accent:#5b5ef4;--shadow:0 1px 3px rgba(20,24,50,.08),0 8px 24px rgba(20,24,50,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--panel:#181c2e;--panel2:#20253b;--text:#e8eafc;--muted:#8f96b5;--line:#2a3050;--accent:#7c7fff;--shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0f1220;--panel:#181c2e;--panel2:#20253b;--text:#e8eafc;--muted:#8f96b5;--line:#2a3050;--accent:#7c7fff;--shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:#ef4444}.btn.sm{padding:5px 9px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--c,var(--accent))}
.stat b{font-size:26px;letter-spacing:-.02em;display:block}.stat small{color:var(--muted);font-weight:600}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:200px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 12px;border-radius:99px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--panel2);border-radius:14px;padding:10px;min-height:140px}.col.over{outline:2px dashed var(--c)}
.col h3{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}.col h3 em{margin-left:auto;font-style:normal;background:var(--panel);padding:1px 8px;border-radius:99px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-2px);border-color:var(--c)}.card b{display:block;font-size:14px}.card .role{color:var(--muted);font-size:13px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted)}
.tag{background:var(--panel2);padding:2px 8px;border-radius:99px;font-weight:600}.tag.warn{background:#ef444422;color:#ef4444}.tag.hi{background:#f59e0b22;color:#d97706}
.pill{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);padding:3px 10px;border-radius:99px;font-weight:700;font-size:12px;white-space:nowrap}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel2)}tr.row{cursor:pointer}tr.row:hover td{background:var(--panel2)}
select.st{border:0;font:inherit;font-weight:700;font-size:12px;padding:4px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);cursor:pointer}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}.empty h2{color:var(--text);margin:0 0 6px}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px;overflow:auto;z-index:10}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 14px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;margin-top:5px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;text-transform:none;letter-spacing:0;font-weight:400}
input:focus,select:focus,textarea:focus,.search:focus{outline:2px solid var(--accent);outline-offset:0}
textarea{min-height:90px;resize:vertical}.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.foot .l{margin-right:auto}
.sec{margin:18px 0 8px;font-weight:700;font-size:13px}.fl{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);border-radius:9px;margin-bottom:6px}.fl span{flex:1}.fl small{color:var(--muted)}
.stars button{background:none;border:0;font-size:18px;cursor:pointer;color:var(--line);padding:0 1px}.stars button.on{color:#f59e0b}
a{color:var(--accent)}
@media(max-width:560px){.grid{grid-template-columns:1fr}.board{grid-auto-columns:82%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Job<span>Track</span></h1><div class="sub">Your personal application pipeline · <span id="sync">Loading…</span></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-act="settings">⚙ Fields &amp; Data</button>
      <button class="btn" data-act="theme">◐</button>
      <button class="btn pri" data-act="new">+ Add application</button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input class="search" id="q" placeholder="Search company, role, location, notes…">
    <div class="seg"><button data-act="view" data-v="board" id="vb">Board</button><button data-act="view" data-v="list" id="vl">List</button></div>
    <select id="sort" class="search" style="flex:none;min-width:150px;margin:0"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="co">Company A–Z</option><option value="pri">Priority</option><option value="fu">Follow-up date</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="main"></div>
</div>
<div id="modal"></div>
<input type="file" id="imp" accept=".json" hidden>
<script>
const ST=[
 {id:'wishlist',l:'Wishlist',c:'#8b8fa3'},{id:'applied',l:'Applied',c:'#4f7cff'},{id:'heard',l:'Heard back',c:'#a855f7'},
 {id:'interview',l:'Interview',c:'#f59e0b'},{id:'selected',l:'Selected',c:'#10b981'},{id:'rejected',l:'Rejected',c:'#ef4444'},{id:'withdrawn',l:'Withdrawn',c:'#6b7280'}];
const SM=Object.fromEntries(ST.map(s=>[s.id,s]));
const KEY='jobtracker.v1';
let state={jobs:[],fields:[{id:'f1',name:'Referral',type:'text'},{id:'f2',name:'Expected CTC',type:'text'}]};
try{const r=localStorage.getItem(KEY);if(r)state=JSON.parse(r)}catch(e){}
let ui={view:'board',q:'',filter:'all',sort:'new'};
try{ui.view=localStorage.getItem(KEY+'.view')||'board';const t=localStorage.getItem(KEY+'.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{state.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}queueSync()};
let dbDoc=null,syncT=null,writing=false;
const setSync=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
function queueSync(){if(!dbDoc)return;setSync('Saving…');clearTimeout(syncT);syncT=setTimeout(flush,600)}
async function flush(){if(writing){syncT=setTimeout(flush,400);return}writing=true;try{await dbDoc.set(JSON.parse(JSON.stringify(state)));setSync('✓ Saved to your account')}catch(e){setSync('Saved on this device only')}writing=false}
(async()=>{try{if(!window.claude){setSync('Saved on this device');return}const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user){setSync('Saved on this device');return}const id=await user.id();if(!id){setSync('Saved on this device');return}dbDoc=db.doc('data/users/'+id+'/tracker');const s=await dbDoc.get();const d=s.exists?s.data():null;if(d&&Array.isArray(d.jobs)&&(d.updatedAt||0)>=(state.updatedAt||0)){state={jobs:d.jobs,fields:d.fields||[],updatedAt:d.updatedAt};try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}renderMain()}else if(state.updatedAt){await flush();return}setSync('✓ Saved to your account')}catch(e){setSync('Saved on this device only')}})();
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'';
const ago=d=>{if(!d)return'';const n=Math.round((new Date(today()+'T00:00')-new Date(d+'T00:00'))/864e5);return n<=0?'today':n+'d ago'};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const open=id=>state.jobs.filter(j=>['applied','heard','interview'].includes(j.status));

function visible(){
  const q=ui.q.toLowerCase();
  let a=state.jobs.filter(j=>(ui.filter==='all'||j.status===ui.filter)&&(!q||JSON.stringify(Object.values(j)).toLowerCase().includes(q)));
  const s=ui.sort;
  a.sort((x,y)=>s==='old'?(x.date||'').localeCompare(y.date||''):s==='co'?x.company.localeCompare(y.company):s==='pri'?(y.priority||0)-(x.priority||0):s==='fu'?(x.followup||'9').localeCompare(y.followup||'9'):(y.date||'').localeCompare(x.date||''));
  return a;
}
function renderStats(){
  const J=state.jobs,c=s=>J.filter(j=>j.status===s).length,sent=J.filter(j=>j.status!=='wishlist').length;
  const resp=J.filter(j=>['heard','interview','selected','rejected'].includes(j.status)).length;
  const items=[['Total',J.length,'#5b5ef4'],['Applied',c('applied'),SM.applied.c],['Heard back',c('heard'),SM.heard.c],['Interviews',c('interview'),SM.interview.c],['Selected',c('selected'),SM.selected.c],['Rejected',c('rejected'),SM.rejected.c],['Response rate',sent?Math.round(resp/sent*100)+'%':'–','#06b6d4']];
  $('#stats').innerHTML=items.map(([l,v,col])=>`<div class="stat" style="--c:${col}"><b>${v}</b><small>${l}</small></div>`).join('');
}
function renderChips(){
  $('#chips').innerHTML=[{id:'all',l:'All'},...ST].map(s=>`<button class="chip ${ui.filter===s.id?'on':''}" data-act="filter" data-v="${s.id}">${s.l}${s.id!=='all'?' · '+state.jobs.filter(j=>j.status===s.id).length:''}</button>`).join('');
  $('#vb').className=ui.view==='board'?'on':'';$('#vl').className=ui.view==='list'?'on':'';
}
const stars=n=>n?'★'.repeat(n):'';
function cardTags(j){
  const od=j.followup&&j.followup<today()&&!['selected','rejected','withdrawn'].includes(j.status);
  return `${j.priority>=4?`<span class="tag hi">${stars(j.priority)}</span>`:''}${j.date?`<span class="tag">${ago(j.date)}</span>`:''}${j.followup?`<span class="tag ${od?'warn':''}">↻ ${fmt(j.followup)}</span>`:''}${j.location?`<span class="tag">${esc(j.location)}</span>`:''}${j.salary?`<span class="tag">${esc(j.salary)}</span>`:''}`;
}
function renderMain(){
  renderStats();renderChips();
  const L=visible();
  if(!state.jobs.length){$('#main').innerHTML=`<div class="empty"><h2>No applications yet</h2><p>Add your first one, or load a few samples to explore.</p><button class="btn pri" data-act="new">+ Add application</button> <button class="btn" data-act="sample">Load samples</button></div>`;return}
  if(!L.length){$('#main').innerHTML=`<div class="empty"><h2>Nothing matches</h2><p>Try a different search or filter.</p></div>`;return}
  if(ui.view==='board'){
    const cols=ui.filter==='all'?ST:ST.filter(s=>s.id===ui.filter);
    $('#main').innerHTML=`<div class="board">${cols.map(s=>{const js=L.filter(j=>j.status===s.id);return `<div class="col" data-col="${s.id}" style="--c:${s.c}"><h3><span class="dot"></span>${s.l}<em>${js.length}</em></h3>${js.map(j=>`<div class="card" draggable="true" data-id="${j.id}" data-act="edit" style="--c:${s.c}"><b>${esc(j.company)}</b><div class="role">${esc(j.role)}</div><div class="meta">${cardTags(j)}</div></div>`).join('')}</div>`}).join('')}</div>`;
  }else{
    $('#main').innerHTML=`<div class="tbl"><table><thead><tr><th>Company / Role</th><th>Status</th><th>Applied</th><th>Follow-up</th><th>Priority</th><th>Location</th>${state.fields.map(f=>`<th>${esc(f.name)}</th>`).join('')}</tr></thead><tbody>${L.map(j=>`<tr class="row" data-act="edit" data-id="${j.id}"><td><b>${esc(j.company)}</b><div style="color:var(--muted)">${esc(j.role)}</div></td><td><select class="st" data-act="stsel" data-id="${j.id}" style="--c:${SM[j.status].c}">${ST.map(s=>`<option value="${s.id}" ${s.id===j.status?'selected':''}>${s.l}</option>`).join('')}</select></td><td>${fmt(j.date)}</td><td>${fmt(j.followup)}</td><td style="color:#f59e0b">${stars(j.priority)}</td><td>${esc(j.location)}</td>${state.fields.map(f=>`<td>${cv(j,f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
}
function cv(j,f){const v=(j.custom||{})[f.id];if(!v)return'';return f.type==='link'&&safeUrl(v)?`<a href="${esc(v)}" target="_blank" rel="noopener">Open</a>`:f.type==='date'?fmt(v):esc(v)}

function fieldInput(f,v){
  const n=`name="c_${f.id}"`;
  if(f.type==='select')return `<select ${n}><option value=""></option>${(f.options||[]).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  return `<input ${n} type="${f.type==='link'?'url':f.type}" value="${esc(v||'')}">`;
}
let curPri=0;
function openForm(id){
  const j=state.jobs.find(x=>x.id===id)||{status:'applied',date:today(),custom:{},priority:3};curPri=j.priority||0;
  $('#modal').innerHTML=`<div class="ov" data-act="closeov"><form class="modal" id="f" data-id="${id||''}"><h2>${id?'Edit application':'New application'}</h2><div class="grid">
  <div><label>Company *<input name="company" required value="${esc(j.company)}"></label></div>
  <div><label>Role / Position *<input name="role" required value="${esc(j.role)}"></label></div>
  <div><label>Status<select name="status">${ST.map(s=>`<option value="${s.id}" ${s.id===j.status?'selected':''}>${s.l}</option>`).join('')}</select></label></div>
  <div><label>Date applied<input type="date" name="date" value="${esc(j.date)}"></label></div>
  <div><label>Location<input name="location" value="${esc(j.location)}" placeholder="Remote, Kolkata…"></label></div>
  <div><label>Salary / CTC<input name="salary" value="${esc(j.salary)}"></label></div>
  <div><label>Source<input name="source" value="${esc(j.source)}" placeholder="LinkedIn, referral…"></label></div>
  <div><label>Follow-up date<input type="date" name="followup" value="${esc(j.followup)}"></label></div>
  <div><label>Contact person<input name="contact" value="${esc(j.contact)}"></label></div>
  <div><label>Priority<div class="stars" id="stars"></div></label></div>
  <div class="full"><label>Job link<input type="url" name="link" value="${esc(j.link)}" placeholder="https://"></label></div>
  ${state.fields.map(f=>`<div><label>${esc(f.name)}${fieldInput(f,(j.custom||{})[f.id])}</label></div>`).join('')}
  <div class="full"><label>Notes<textarea name="notes">${esc(j.notes)}</textarea></label></div></div>
  <div class="foot">${id?'<button type="button" class="btn danger l" data-act="del">Delete</button>':''}<button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri" type="submit">Save</button></div></form></div>`;
  drawStars();
}
function drawStars(){$('#stars').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="${n<=curPri?'on':''}" data-act="star" data-v="${n}">★</button>`).join('')}
function openSettings(){
  $('#modal').innerHTML=`<div class="ov" data-act="closeov"><div class="modal"><h2>Fields &amp; Data</h2>
  <div class="sec">Your custom fields</div><div id="fl">${state.fields.map(f=>`<div class="fl"><span><b>${esc(f.name)}</b> <small>${f.type}${f.type==='select'?': '+esc((f.options||[]).join(', ')):''}</small></span><button class="btn sm danger" data-act="delf" data-id="${f.id}">Remove</button></div>`).join('')||'<div class="sub">None yet.</div>'}</div>
  <div class="grid" style="margin-top:10px"><div><label>Field name<input id="fn" placeholder="e.g. Round, Tech stack"></label></div>
  <div><label>Type<select id="ft"><option value="text">Text</option><option value="number">Number</option><option value="date">Date</option><option value="link">Link</option><option value="select">Dropdown</option></select></label></div>
  <div class="full"><label>Dropdown options (comma separated)<input id="fo" placeholder="Phone, Technical, HR"></label></div></div>
  <div class="foot" style="margin-top:10px"><button class="btn pri" data-act="addf">+ Add field</button></div>
  <div class="sec">Backup &amp; export</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="expjson">Export JSON</button><button class="btn" data-act="impjson">Import JSON</button><button class="btn" data-act="expcsv">Export CSV</button><button class="btn danger" data-act="clear">Delete all data</button></div>
  <p class="sub">Your data is saved automatically to your account and reloads every time you open this page. A JSON backup is still a good idea.</p>
  <div class="foot"><button class="btn" data-act="close">Done</button></div></div></div>`;
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(){
  const H=['Company','Role','Status','Date applied','Follow-up','Priority','Location','Salary','Source','Contact','Link','Notes',...state.fields.map(f=>f.name)];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  return [H.map(q).join(','),...state.jobs.map(j=>[j.company,j.role,SM[j.status].l,j.date,j.followup,j.priority,j.location,j.salary,j.source,j.contact,j.link,j.notes,...state.fields.map(f=>(j.custom||{})[f.id])].map(q).join(','))].join('\n');
}
function sample(){
  const d=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
  state.jobs=[['Stripe','Backend Engineer','interview',6,'Remote',5],['Razorpay','Product Analyst','heard',10,'Bengaluru',4],['Zomato','Data Analyst','applied',3,'Gurugram',3],['Atlassian','Frontend Developer','selected',30,'Remote',5],['Flipkart','SDE II','rejected',20,'Bengaluru',2],['Notion','Designer','wishlist',0,'Remote',4]].map(([company,role,status,n,location,priority])=>({id:uid(),company,role,status,date:d(n),location,priority,custom:{}}));
  save();renderMain();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='closeov'){if(e.target===t)$('#modal').innerHTML='';return}
  if(a==='stsel'){e.stopPropagation();return}
  if(a==='edit'&&e.target.closest('select,a'))return;
  switch(a){
   case'new':openForm();break;case'edit':openForm(id);break;case'close':$('#modal').innerHTML='';break;
   case'settings':openSettings();break;case'sample':sample();break;
   case'theme':{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;const n=dark?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem(KEY+'.theme',n)}catch(x){}break}
   case'view':ui.view=t.dataset.v;try{localStorage.setItem(KEY+'.view',ui.view)}catch(x){}renderMain();break;
   case'filter':ui.filter=t.dataset.v;renderMain();break;
   case'star':curPri=curPri==+t.dataset.v?0:+t.dataset.v;drawStars();break;
   case'del':if(confirm('Delete this application?')){state.jobs=state.jobs.filter(j=>j.id!==$('#f').dataset.id);save();$('#modal').innerHTML='';renderMain()}break;
   case'addf':{const name=$('#fn').value.trim();if(!name)return;const type=$('#ft').value;state.fields.push({id:'f'+uid(),name,type,options:type==='select'?$('#fo').value.split(',').map(s=>s.trim()).filter(Boolean):undefined});save();openSettings();renderMain();break}
   case'delf':if(confirm('Remove this field? Its saved values will be hidden.')){state.fields=state.fields.filter(f=>f.id!==id);save();openSettings();renderMain()}break;
   case'expjson':dl('job-tracker-backup.json',JSON.stringify(state,null,2),'application/json');break;
   case'expcsv':dl('job-applications.csv',csv(),'text/csv');break;
   case'impjson':$('#imp').click();break;
   case'clear':if(confirm('Delete ALL applications? This cannot be undone.')){state.jobs=[];save();$('#modal').innerHTML='';renderMain()}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='stsel'){const j=state.jobs.find(x=>x.id===t.dataset.id);j.status=t.value;save();renderMain()}
  if(t.id==='sort'){ui.sort=t.value;renderMain()}
  if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.jobs))throw 0;state={jobs:d.jobs,fields:d.fields||[]};save();$('#modal').innerHTML='';renderMain()}catch(x){alert('That file is not a valid backup.')}};r.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,fd=new FormData(f),id=f.dataset.id;
  const o={};['company','role','status','date','location','salary','source','followup','contact','link','notes'].forEach(k=>o[k]=(fd.get(k)||'').toString().trim());
  o.priority=curPri;o.custom={};state.fields.forEach(x=>o.custom[x.id]=(fd.get('c_'+x.id)||'').toString().trim());
  if(id){const j=state.jobs.find(x=>x.id===id);Object.assign(j,o,{custom:{...(j.custom||{}),...o.custom}})}else state.jobs.push({id:uid(),...o});
  save();$('#modal').innerHTML='';renderMain();
});
$('#q').addEventListener('input',e=>{ui.q=e.target.value;renderMain()});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(c){dragId=c.dataset.id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}}});
document.addEventListener('dragover',e=>{const c=e.target.closest('.col');document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));if(c&&dragId){e.preventDefault();c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=e.target.closest('.col');if(c&&dragId){e.preventDefault();const j=state.jobs.find(x=>x.id===dragId);if(j){j.status=c.dataset.col;save()}dragId=null;renderMain()}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML=''});
renderMain();
</script>
</body>
</html>
